<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>冰霜毛玻璃卡片预览</title>

  <style>
    :root {
      /* 与项目 src/assets/css/index.scss 保持同名主题变量。 */
      --yh-brand-color-1: #ecf2fe;
      --yh-brand-color-3: #bbd3fb;
      --yh-brand-color-5: #699ef5;
      --yh-brand-color-7: #266fe8;
      --yh-text-color-primary: #1d2129;
      --yh-text-color-anti: #fff;
      --dd-html-bg: #f2f3f5;
      --page-bg:
        linear-gradient(
          180deg,
          color-mix(in srgb, var(--yh-brand-color-7) 48%, var(--dd-html-bg)) 0%,
          color-mix(in srgb, var(--yh-brand-color-5) 40%, var(--dd-html-bg)) 36%,
          color-mix(in srgb, var(--yh-brand-color-3) 32%, var(--dd-html-bg)) 62%,
          var(--dd-html-bg) 100%
        );

      --glass-bg: rgba(226, 238, 248, 0.035);
      --glass-top: rgba(255, 255, 255, 0.08);
      --glass-bottom: rgba(255, 255, 255, 0.018);
      --glass-border: rgba(226, 244, 255, 0.76);
      --glass-shadow: rgba(13, 35, 55, 0.22);

      --button-color: #25313a;
      --button-bg-start: rgba(255, 255, 255, 0.88);
      --button-bg-end: rgba(255, 255, 255, 0.46);
    }

    :root[theme-mode="dark"] {
      --yh-brand-color-1: #1b2f51;
      --yh-brand-color-3: #143975;
      --yh-brand-color-5: #0d429a;
      --yh-brand-color-7: #2667d4;
      --yh-text-color-primary: #f2f3f5;
      --yh-text-color-anti: #000;
      --dd-html-bg: #171a1f;
      --page-bg:
        linear-gradient(
          180deg,
          color-mix(in srgb, var(--yh-brand-color-7) 48%, var(--dd-html-bg)) 0%,
          color-mix(in srgb, var(--yh-brand-color-5) 40%, var(--dd-html-bg)) 36%,
          color-mix(in srgb, var(--yh-brand-color-3) 32%, var(--dd-html-bg)) 62%,
          var(--dd-html-bg) 100%
        );

      --glass-bg: rgba(24, 34, 42, 0.24);
      --glass-top: rgba(255, 255, 255, 0.11);
      --glass-bottom: rgba(255, 255, 255, 0.035);
      --glass-border: rgba(174, 215, 246, 0.5);
      --glass-shadow: rgba(0, 0, 0, 0.46);

      --button-color: #f4f7fa;
      --button-bg-start: rgba(255, 255, 255, 0.22);
      --button-bg-end: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-width: 320px;
      overflow: hidden;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: var(--page-bg);
      transition: background 300ms ease;
    }

    .page {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 28px 18px;
      overflow: hidden;
    }

    .page::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: 0;
      filter: blur(8px) saturate(125%);
      opacity: 0.92;
      transition: opacity 300ms ease, filter 300ms ease;
    }

    :root[theme-mode="dark"] .page::before {
      opacity: 0.68;
      filter: blur(11px) saturate(105%) brightness(0.78);
    }

    .page::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 38%, rgba(255, 255, 255, 0.12), transparent 44%),
        linear-gradient(90deg, rgba(12, 20, 29, 0.2), transparent 24% 76%, rgba(8, 12, 18, 0.18));
    }

    .theme-button {
      position: relative;
      z-index: 2;
      min-width: 148px;
      height: 46px;
      padding: 0 20px;
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 999px;
      color: var(--button-color);
      background: linear-gradient(145deg, var(--button-bg-start), var(--button-bg-end));
      box-shadow: 0 12px 28px rgba(12, 26, 39, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .glass-card {
      position: relative;
      z-index: 1;
      isolation: isolate;
      width: min(630px, calc(100vw - 28px));
      height: min(720px, calc(100vh - 130px));
      min-height: 430px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      border-radius: 60px;
      background: linear-gradient(145deg, var(--glass-top) 0%, rgba(255, 255, 255, 0.02) 24%, transparent 48%, var(--glass-bottom) 100%), var(--glass-bg);
      box-shadow: 0 30px 72px var(--glass-shadow), 0 6px 18px rgba(0, 0, 0, 0.08), inset 1px 1px 0 rgba(255, 255, 255, 0.62), inset -1px -1px 0 rgba(206, 235, 255, 0.34), inset 0 18px 34px rgba(255, 255, 255, 0.035), inset 0 -24px 46px rgba(18, 32, 43, 0.06);
      backdrop-filter: blur(12px) saturate(150%) brightness(1.03);
      -webkit-backdrop-filter: blur(12px) saturate(150%) brightness(1.03);
      transition: background 300ms ease, border-color 300ms ease, box-shadow 300ms ease, backdrop-filter 300ms ease;
    }

    .glass-card::before {
      content: "";
      position: absolute;
      z-index: 2;
      inset: 0;
      padding: 1.5px;
      border-radius: inherit;
      pointer-events: none;
      background: conic-gradient(from 205deg at 50% 50%, rgba(225, 246, 255, 0.96) 0deg, rgba(121, 196, 255, 0.98) 54deg, rgba(205, 132, 255, 0.74) 108deg, rgba(255, 130, 171, 0.78) 148deg, rgba(255, 255, 255, 0.92) 198deg, rgba(201, 231, 255, 0.82) 253deg, rgba(99, 182, 255, 0.96) 312deg, rgba(225, 246, 255, 0.96) 360deg);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      opacity: 0.92;
    }

    .glass-card::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      background: radial-gradient(ellipse at 28% 4%, rgba(255, 255, 255, 0.25), transparent 35%), radial-gradient(ellipse at 76% 100%, rgba(255, 255, 255, 0.15), transparent 42%), linear-gradient(180deg, rgba(222, 240, 255, 0.04), rgba(255, 255, 255, 0.11));
    }

    :root[theme-mode="dark"] .glass-card {
      backdrop-filter: blur(36px) saturate(150%) brightness(0.88);
      -webkit-backdrop-filter: blur(36px) saturate(150%) brightness(0.88);
      box-shadow: 0 34px 82px var(--glass-shadow), 0 8px 22px rgba(0, 0, 0, 0.16), inset 1px 1px 0 rgba(255, 255, 255, 0.34), inset -1px -1px 0 rgba(123, 179, 220, 0.18), inset 0 18px 34px rgba(255, 255, 255, 0.018), inset 0 -24px 46px rgba(0, 0, 0, 0.1);
    }

    @media (max-width: 700px) {
      .page { gap: 20px; padding: 18px 10px; }
      .glass-card { width: calc(100vw - 24px); height: min(70vh, 680px); border-radius: 44px; }
    }
  </style>
</head>

<body>
  <main class="page">
    <button id="themeButton" class="theme-button" type="button">切换深色主题</button>
    <section class="glass-card" aria-label="空白毛玻璃卡片"></section>
  </main>

  <script>
    const themeButton = document.getElementById("themeButton");
    themeButton.addEventListener("click", () => {
      const root = document.documentElement;
      const isDark = root.getAttribute("theme-mode") !== "dark";
      root.setAttribute("theme-mode", isDark ? "dark" : "light");
      themeButton.textContent = isDark ? "切换浅色主题" : "切换深色主题";
    });
  </script>
</body>
</html>
